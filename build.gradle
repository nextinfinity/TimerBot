plugins {
    id "com.gradleup.shadow" version "9.6.1"
    id "io.freefair.lombok" version "9.5.0"
}

apply plugin: 'java'
version = providers.gradleProperty('appVersion').orElse('0.0.0-SNAPSHOT').get()
if (!(version.toString() ==~ /[0-9A-Za-z][0-9A-Za-z.+_-]*/)) {
    throw new GradleException('appVersion must contain only letters, digits, dots, plus signs, underscores, or hyphens, and start with a letter or digit.')
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

shadowJar {
    filesMatching('META-INF/*.kotlin_module') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'net.nextinfinity.timerbot.TimerBot',
                'Implementation-Version': project.version.toString()
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    mockitoAgent('org.mockito:mockito-core:5.23.0') { transitive = false }

    // Keep JDA's transitive Jackson modules aligned and explicitly updateable.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.3')

    implementation 'net.dv8tion:JDA:6.6.0'
    implementation 'org.reflections:reflections:0.10.2'

    runtimeOnly 'org.slf4j:slf4j-reload4j:2.0.19'
}
